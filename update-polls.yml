name: Update polls

on:
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: R packages
        run: Rscript -e 'install.packages(c("rvest","xml2","dplyr","tidyr","stringr","lubridate","ggplot2","purrr","jsonlite"))'

      - name: Run the script
        run: Rscript polls_tracker.R

      - name: Commit new data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add polls.js
          git diff --staged --quiet || (git commit -m "Update polls" && git push)
